<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset ="UTF-8">
        <meta name ="viewport" content="width=device-width, initial-scale=1.0">
        <title>GymCompass</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>
                <svg class="logo" viewBox="0 0 24 24" width="36" height="36">
                  <circle cx="12" cy="12" r="10" fill="white" stroke="#ff6b00" stroke-width="2" />
                  <g stroke="#1a1a1a" stroke-width="1" stroke-linecap="round">
                    <line x1="12" y1="3.6" x2="12" y2="5.4" />
                    <line x1="12" y1="18.6" x2="12" y2="20.4" />
                    <line x1="3.6" y1="12" x2="5.4" y2="12" />
                    <line x1="18.6" y1="12" x2="20.4" y2="12" />
                  </g>
                  <g transform="rotate(45 12 12)">
                    <polygon points="12,5.5 14.2,12 9.8,12" fill="#ff6b00" />
                    <polygon points="12,18.5 14.2,12 9.8,12" fill="#b0b7c3" />
                  </g>
                  <circle cx="12" cy="12" r="1.1" fill="white" stroke="#1a1a1a" stroke-width="0.6" />
                </svg>GymCompass
              </h1>
            <p>Interactive muscle map and workout guide</p>
          </header>
          
          <main>
            <section id="map">
              <h2>Pick a muscle area</h2>
            </section>
          
            <section id="info">
              <h2>Exercises</h2>
              <p>Select a muscle to see exercises.</p>
            </section>
          </main>
          
          <footer>
            <p>General information only, not medical advice.</p>
          </footer>  
    </body>
</html>
